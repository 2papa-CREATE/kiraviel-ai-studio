<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キラヴィエル AI Studio v0.1</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#eef2ff;margin:0}main{max-width:800px;margin:auto;padding:20px}h1{font-size:1.5rem}section{background:#1d293b;padding:16px;border-radius:14px;margin:14px 0}label{display:block;margin:12px 0 4px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #526078;font:inherit}input,textarea,select{background:#101827;color:white}button{background:#a5b4fc;color:#111827;font-weight:700;margin-top:10px;cursor:pointer}button.secondary{background:#334155;color:white}small{color:#cbd5e1}article{border-top:1px solid #475569;padding:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1422;padding:12px;border-radius:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><main><h1>✦ キラヴィエル AI Studio <small>v0.1</small></h1><p>スマホで使えるローカル試作版。データはこのブラウザ内に保存されます。</p><section><h2>プロジェクト設定</h2><label>楽曲名</label><input id="song" value="セイシュン☆アクセル"><label>キャラクター名</label><input id="character" value="司"><label>キャラクター設定・外見の注意</label><textarea id="profile" rows="3" placeholder="例：基準画像の顔・髪型・衣装を厳守"></textarea><label>歌詞（任意）</label><textarea id="lyrics" rows="5" placeholder="歌詞を貼り付け"></textarea><label>基準画像（端末から選択・プレビューのみ）</label><input id="image" type="file" accept="image/*"><img id="preview" alt="基準画像プレビュー" style="display:none;max-width:100%;max-height:240px;margin-top:10px;border-radius:8px"><small>画像ファイルは保存・送信しません。再読み込み後は選び直してください。</small></section><section><h2>カットを追加</h2><label>開始秒</label><input id="start" type="number" min="0" step="0.1" value="0"><label>長さ（秒）</label><input id="duration" type="number" min="1" max="30" step="0.1" value="5"><label>演出</label><textarea id="scene" rows="3" placeholder="例：夕暮れの屋上で司が微笑み、風で髪が揺れる"></textarea><label>画面比率</label><select id="ratio"><option>16:9</option><option>9:16</option></select><button id="add">カット追加・プロンプト作成</button></section><section><h2>カット一覧</h2><div id="shots"></div><div class="actions"><button class="secondary" id="export">JSON保存</button><button class="secondary" id="clear">全カット削除</button></div><small>動画生成APIへの自動送信は未実装。プロンプトをコピーして利用できます。</small></section></main><script>
const $=id=>document.getElementById(id);let shots=[];try{shots=JSON.parse(localStorage.getItem('kiraviel_shots')||'[]')}catch{};for(const id of ['song','character','profile','lyrics']){const old=localStorage.getItem('kiraviel_'+id);if(old!==null)$(id).value=old;$(id).addEventListener('input',()=>localStorage.setItem('kiraviel_'+id,$(id).value))}
$('image').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);$('preview').src=url;$('preview').style.display='block'});
function prompt(s){return `Create an anime music video shot for the fictional music project Kiraviel. Song: ${$('song').value}. Character: ${$('character').value}. Character continuity requirements: ${$('profile').value||'Strictly match the supplied character reference image; preserve face, hairstyle, outfit and colors.'}. Scene direction: ${s.scene}. Duration: ${s.duration} seconds. Aspect ratio: ${s.ratio}. Cinematic composition, coherent motion, consistent anatomy, no unwanted text, no watermarks. Use the supplied reference image as the visual source. Do not redesign the character.`}
function save(){localStorage.setItem('kiraviel_shots',JSON.stringify(shots));render()}
function render(){const root=$('shots');root.replaceChildren();if(!shots.length){root.textContent='まだカットがありません。';return}shots.forEach((s,i)=>{const a=document.createElement('article');const h=document.createElement('h3');h.textContent=`カット ${i+1}｜${s.start}秒〜${Number(s.start)+Number(s.duration)}秒`;const p=document.createElement('p');p.textContent=s.scene;const pre=document.createElement('pre');pre.textContent=prompt(s);const copy=document.createElement('button');copy.textContent='プロンプトをコピー';copy.onclick=async()=>{try{await navigator.clipboard.writeText(prompt(s));copy.textContent='コピーしました'}catch{alert('コピーできません。テキストを選択してください。')}};const del=document.createElement('button');del.className='secondary';del.textContent='このカットを削除';del.onclick=()=>{shots.splice(i,1);save()};a.append(h,p,pre,copy,del);root.append(a)})}
$('add').onclick=()=>{const start=Number($('start').value),duration=Number($('duration').value),scene=$('scene').value.trim();if(!scene||!Number.isFinite(start)||start<0||!Number.isFinite(duration)||duration<1||duration>30){alert('演出、開始秒、長さ（1〜30秒）を確認してください');return}shots.push({start,duration,scene,ratio:$('ratio').value});shots.sort((a,b)=>a.start-b.start);save();$('start').value=start+duration;$('scene').value=''};
$('export').onclick=()=>{const data={version:'0.1',song:$('song').value,character:$('character').value,profile:$('profile').value,lyrics:$('lyrics').value,shots:shots.map(s=>({...s,prompt:prompt(s)}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kiraviel-storyboard.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('clear').onclick=()=>{if(confirm('すべてのカットを削除しますか？')){shots=[];save()}};render();
</script></body></html>
